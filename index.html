<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constelar la constelación - I Jornada de Jóvenes Investigadores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            color: #333;
            background-color: #000;
        }
        
        .hero {
            background-color: #D32F2F;
            color: white;
            text-align: center;
            padding: 120px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 8px solid #000;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03) 0px,
                rgba(0, 0, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }
        
        .hero-content {
            position: relative;
            z-index: 1;
        }
        
        .hero h1 {
            font-size: 4em;
            margin-bottom: 30px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #FFF;
            text-shadow: 3px 3px 0 #000, 6px 6px 0 rgba(0,0,0,0.3);
            line-height: 1.1;
        }
        
        .hero h2 {
            font-size: 2em;
            margin: 0;
            font-weight: 700;
            line-height: 1.3;
            max-width: 900px;
            color: #000;
            text-shadow: 2px 2px 0 #FFF;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .star {
            display: inline-block;
            font-size: 3em;
            margin: 0 20px;
            color: #FFF;
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5em;
                letter-spacing: 2px;
            }
            
            .hero h2 {
                font-size: 1.3em;
                letter-spacing: 1px;
            }
            
            .star {
                font-size: 2em;
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>★ Constelar la constelación ★</h1>
            <h2>I jornada de jóvenes investigadores en teoría crítica</h2>
        </div>
    </div>
</body>
</html>
